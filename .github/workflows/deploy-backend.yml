# Deploys database migrations and edge functions to Supabase on every push to main.
# Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (see README).
name: Deploy backend
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'src/core/**']
  workflow_dispatch:
concurrency: deploy-backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lzczfbpiolguerdbsvjy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets"; exit 1
          fi
      - run: node scripts/sync-shared.mjs
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

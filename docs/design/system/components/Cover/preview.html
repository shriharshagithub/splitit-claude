<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@700&family=Mukta:wght@400&display=swap">
<style>
body{margin:0;background:var(--ground)}
.cover{position:relative;width:960px;height:300px;background:var(--ground);overflow:hidden}
.cover svg{position:absolute;inset:0}
.name{position:absolute;left:var(--space-8);bottom:56px;margin:0;font:700 100px/0.95 var(--font-display);letter-spacing:-0.02em;color:var(--ink)}
.tag{position:absolute;left:var(--space-8);bottom:var(--space-6);margin:0;max-width:440px;font:400 14px/20px var(--font-body);color:var(--ink-muted)}
.brand{fill:var(--brand)}.accent{fill:var(--accent)}.ink{fill:var(--ink)}.pos{fill:var(--positive)}.neg{fill:var(--negative)}.ground{fill:var(--ground)}.soft{fill:var(--brand-soft)}
</style></head><body>
<div class="cover">
<!--
blocks: brand 192x300 slab, accent 240x144, ink 144x156, positive 96x96, negative 96x60 (sides are multiples of space-12, 48px)
arrangement: one tall brand slab bleeding top and bottom, satellites flush to its right, bleeding off the top and right edges
pattern: split discs (half-rounds). The system's signature shape is a disc cut into shares, one bill divided between people
scales: disc radius space-8 (32px) and 2x space-8, cut gap space-2 (8px), pitch 2x space-12 (96px)
-->
<svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
<rect class="brand" x="528" y="0" width="192" height="300"/>
<rect class="accent" x="720" y="0" width="240" height="144"/>
<rect class="ink" x="720" y="144" width="144" height="156"/>
<rect class="pos" x="864" y="144" width="96" height="96"/>
<rect class="neg" x="864" y="240" width="96" height="60"/>
<g>
<path class="accent" d="M620 22a32 32 0 0 0 0 64z"/><path class="ground" d="M628 22a32 32 0 0 1 0 64z"/>
<path class="ground" d="M620 118a32 32 0 0 0 0 64z"/><path class="accent" d="M628 118a32 32 0 0 1 0 64z"/>
<path class="accent" d="M620 214a32 32 0 0 0 0 64z"/><path class="ground" d="M628 214a32 32 0 0 1 0 64z"/>
<path class="ink" d="M836 68V4a64 64 0 0 0-64 64z"/><path class="brand" d="M844 68h64a64 64 0 0 0-64-64z"/>
<path class="brand" d="M836 76h-64a64 64 0 0 0 64 64z"/><path class="ink" d="M844 76v64a64 64 0 0 0 64-64z"/>
<path class="ground" d="M788 190a32 32 0 0 0 0 64z"/><path class="accent" d="M796 190a32 32 0 0 1 0 64z"/>
</g>
</svg>
<p class="name">SplitIt</p>
<p class="tag">One person pays. Everyone settles over UPI.</p>
</div>
</body></html>

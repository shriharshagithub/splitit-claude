<!doctype html>
<html lang="en">

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Mukta:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2b2f8f}a:hover{color:#15163a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f5fb; color: #15163a; font-family: Mukta, 'Noto Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 48px 16px 32px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="width: 48px; height: 48px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px"><span style="background: #2b2f8f; border-radius: 24px 0 0 24px"></span><span style="background: #f5a70a; border-radius: 0 24px 24px 0"></span></span>
    <h1 style="margin: 0; font-family: 'Anek Latin', system-ui, sans-serif; font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em">SplitIt</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #54567a">One person pays. Everyone settles over UPI.</p>
  </div>

  <div role="group" aria-label="Log in or sign up" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #e9eaf4; padding: 4px; border-radius: 14px">
    <button aria-pressed="true" style="min-height: 40px; border: 0; border-radius: 8px; background: #ffffff; color: #15163a; font-family: Mukta, sans-serif; font-size: 14px; line-height: 20px; font-weight: 500; box-shadow: 0 0 0 1px #d6d7e6">Log in</button>
    <button aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: #54567a; font-family: Mukta, sans-serif; font-size: 14px; line-height: 20px; font-weight: 500">Sign up</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="phone" style="font-size: 14px; line-height: 20px; font-weight: 500">Phone number</label>
      <input id="phone" type="tel" value="+91 98450 12345" style="font-family: Mukta, sans-serif; font-size: 16px; line-height: 24px; color: #15163a; background: #ffffff; border: 1px solid #84869f; border-radius: 8px; min-height: 48px; padding: 0 12px; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="pw" style="font-size: 14px; line-height: 20px; font-weight: 500">Password</label>
      <input id="pw" type="password" value="correct-horse" style="font-family: Mukta, sans-serif; font-size: 16px; line-height: 24px; color: #15163a; background: #ffffff; border: 1px solid #84869f; border-radius: 8px; min-height: 48px; padding: 0 12px; box-sizing: border-box">
    </div>
    <a href="#reset" style="align-self: flex-start; font-size: 14px; line-height: 20px; font-weight: 500; color: #2b2f8f">Forgot password? We will email you a reset link</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Main.dc.html" style="min-height: 48px; border-radius: 14px; background: #2b2f8f; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; line-height: 24px; font-weight: 600">Log in</a>
    <div style="display: flex; align-items: center; gap: 12px; color: #54567a; font-size: 13px; line-height: 18px"><span style="flex: 1; height: 1px; background: #d6d7e6"></span>or<span style="flex: 1; height: 1px; background: #d6d7e6"></span></div>
    <button style="min-height: 48px; border-radius: 14px; background: #ffffff; color: #15163a; border: 1px solid #84869f; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Mukta, sans-serif; font-size: 16px; line-height: 24px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15163a" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8"></path><path d="M12 21a9 9 0 1 1 6-15.7"></path></svg>
      Continue with Google
    </button>
  </div>

  <div style="flex: 1"></div>
  <p style="margin: 0; font-size: 13px; line-height: 18px; color: #54567a; text-align: center">New here? Sign up asks for your name, phone, email and a password. You can add your UPI ID later.</p>
</div>
</x-dc>

</html>

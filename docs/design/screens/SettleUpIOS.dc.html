<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settle up on iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Mukta:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2b2f8f}a:hover{color:#15163a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5f5fb; color: #15163a; font-family: Mukta, 'Noto Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 16px 8px 4px">
    <a href="SettleUp.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15163a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Anek Latin', system-ui, sans-serif; font-size: 22px; line-height: 28px; font-weight: 600">Pay Ravi via UPI</h1>
      <span style="font-size: 13px; line-height: 18px; color: #54567a">Flat 402</span>
    </div>
  </div>

  <div style="margin: 12px 16px 0; background: #ffffff; border: 1px solid #d6d7e6; border-radius: 24px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; white-space: nowrap; font-size: 36px; line-height: 40px; font-weight: 600; color: #b4380d">₹1,200.00</span>
    <div role="img" aria-label="UPI QR code for paying Ravi Kumar 1,200 rupees" style="width: 225px; height: 225px; padding: 12px; background: #ffffff; border: 1px solid #d6d7e6; border-radius: 8px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr))">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
        <span style="{{c.style}}"></span>
      </sc-for>
    </div>
    <span style="font-size: 14px; line-height: 20px; color: #54567a; text-align: center">Scan with any UPI app on another phone, or open your UPI app and pay the ID below.</span>
  </div>

  <div style="margin: 12px 16px 0; display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #d6d7e6; border-radius: 14px; padding: 8px 8px 8px 16px">
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 13px; line-height: 18px; color: #54567a">Ravi's UPI ID</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 22px; white-space: nowrap">ravi.kumar@okhdfc</span>
    </span>
    <button onClick="{{copy}}" style="min-height: 40px; padding: 0 16px; border-radius: 14px; background: #ffffff; color: #2b2f8f; border: 1px solid #84869f; font-family: Mukta, sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; cursor: pointer">{{copyLabel}}</button>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 16px 16px 32px; border-top: 1px solid #d6d7e6; display: flex; flex-direction: column; gap: 12px">
    <a href="PaymentCheck.dc.html" style="min-height: 48px; border-radius: 14px; background: #2b2f8f; color: #ffffff; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; line-height: 24px; font-weight: 600">I have paid</a>
    <span style="font-size: 13px; line-height: 18px; color: #54567a; text-align: center">iPhones and computers cannot open the UPI app picker, so SplitIt shows this QR code instead.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { copied: false }; }
  renderVals() {
    var self = this, N = 25, cells = [];
    function finder(r, c) {
      var spots = [[0, 0], [0, N - 7], [N - 7, 0]];
      for (var k = 0; k < 3; k++) {
        var y = r - spots[k][0], x = c - spots[k][1];
        if (y >= 0 && y < 7 && x >= 0 && x < 7) {
          var edge = y === 0 || y === 6 || x === 0 || x === 6, core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
          return edge || core ? 1 : 0;
        }
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
      }
      return -1;
    }
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var f = finder(r, c), on;
      if (f >= 0) on = f === 1;
      else { var h = (r * 73856093) ^ (c * 19349663) ^ 0x5bd1e995; h = (h ^ (h >>> 13)) * 0x5bd1e995; on = ((h >>> 7) & 3) < 2; }
      cells.push({ style: 'display: block; aspect-ratio: 1; background: ' + (on ? '#15163a' : '#ffffff') });
    }
    return { cells: cells, copyLabel: this.state.copied ? 'Copied' : 'Copy', copy: function () { self.setState({ copied: true }); } };
  }
}
</script>
</body>
</html>
